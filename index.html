<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div id="wrapper">
        <h1>My library</h1>
        <div id="book-details">
            <form>
                <label for="title">Title
                    <input type="text" id="title" placeholder="It" required>
                </label> 
                <label for="author">Author
                    <input type="text" id="author" placeholder="Stephen King" required>
                </label>         
                <label for="pages">Pages
                    <input type="number" id="pages" placeholder="1138" required>
                </label>
                <label for="status">I've already read this book
                    <input type="checkbox" id="status">
                </label>
                <input type="submit" value="Submit">
            </form>
        </div>
        <div id="books">
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
